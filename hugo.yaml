# Multilingual configuration
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: "English"
    weight: 1
    contentDir: "content"
    menu:
      main:
        - identifier: research
          name: Research
          title: Research
          url: /publications
          weight: 2
        - identifier: teaching
          name: Teaching
          title: Teaching
          url: /teaching
          weight: 2

